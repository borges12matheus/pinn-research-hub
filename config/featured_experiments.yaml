extends: experiment_import.yaml
selection: featured
staging_output: ../.experiment-import/featured
public_approvals:
  experiments: []
  timeline: []
  figures: []

groups:
  - id: baseline-sst
    title: Baseline SST Re 5.100
    priority: P0
    event: evt-baseline-curadoria-sst
    comparisons: [cmp-sst-20261113-212942]
    metrics:
      test: &accuracy [rmse_uv_corrected, rmse_p_corrected]
      full_domain: &physics [divergence_corrected_rmse, divergence_error_rmse]
    limitations: Mesmo split, seed 42 e RANS fine. A fração supervisionada permanece desconhecida.
    pending: Confirmar as unidades e a escala física do SST antes da comparação quantitativa ou da publicação de figuras.
  - id: replicas-ke
    title: Replicação k–ε Re 36.000
    priority: P0
    event: evt-replicas-ke
    comparisons: [cmp-ke-20260919-024533, cmp-ke-20260919-031341, cmp-ke-20260919-033344]
    metrics:
      test: [rmse_uv_corrected, rmse_p_corrected, divergence_corrected_rmse, divergence_error_rmse]
    paired_summary: true
    limitations: As seeds efetivas são 42, 123 e 456. O conjunto de teste muda por seed. A comparação ocorre dentro de cada par, com síntese descritiva das diferenças.
    pending: Revisar os PNGs em staging e a autorização de divulgação.
  - id: supervisao-sst
    title: Supervisão fine de 50% e 100%
    priority: P0
    event: evt-supervisao-sst
    comparisons: [cmp-sst-20261113-201333, cmp-sst-20261113-204940]
    metrics:
      test: *accuracy
      full_domain: *physics
    preliminary: true
    limitations: A evidência é preliminar e de seed 42. Contagens supervisionadas da PINN vêm dos logs. A fração documentada para a MLP não confirma sua contagem efetiva de pontos.
    pending: Confirmar a identidade e as contagens dos subconjuntos da MLP, replicar em outras seeds e verificar unidades. A hipótese de economia de dados permanece aberta.
  - id: gradientes-sst
    title: Gradientes de velocidade na entrada
    priority: P1
    event: evt-gradientes-sst
    comparisons: [cmp-sst-20261113-022350, cmp-sst-20261113-030752]
    metrics:
      test: *accuracy
      full_domain: *physics
    preliminary: true
    limitations: Cinco entradas básicas versus cinco entradas mais quatro gradientes de velocidade adicionais, no mesmo teste e em seed única.
    observation: Os JSONs da configuração com gradientes registram RMSE global de velocidade e de pressão maiores para ambas as famílias; a observação está limitada à ablação auditada.
    pending: Confirmar unidades e normalização, repetir a ablação e avaliar resultados por região.
  - id: momento-ke
    title: Continuidade e momento em k–ε
    priority: P1
    event: evt-variantes-momento-ke
    comparisons: [cmp-ke-20260826-003110, cmp-ke-20260827-014545]
    include_event_runs: true
    metrics:
      test: *accuracy
      full_domain: *physics
    limitations: Estudo descritivo de configurações completas. Variam entradas, pesos e etapas de treino. As métricas físicas disponíveis medem divergência.
    pending: Controlar as demais mudanças e medir o resíduo de momento de forma independente antes de uma afirmação causal.
  - id: multicaso-ke
    title: Conjunto combinado Re 20.000, 28.000 e 36.000
    priority: P1
    event: evt-multicaso-ke
    comparisons: [cmp-ke-20260908-152958, cmp-ke-20260909-013552]
    metrics:
      test: *accuracy
      full_domain: *physics
    limitations: Os resultados descrevem um teste espacial sobre o conjunto combinado. Coordenadas repetem entre casos e falta identificação de Reynolds por linha na saída.
    pending: Recuperar identificação dos casos, versão original do dataset e unidades. Generalização para Reynolds não visto requer teste com um caso inteiro retido.
  - id: re32000-ke
    title: Caso isolado Re 32.000
    priority: P1
    event: evt-caso-re32000-ke
    comparisons: [cmp-ke-20260909-212414]
    require_shared_test: [exp-ke-pinn-cont-mom-base-20260910-001208]
    metrics:
      test: *accuracy
      full_domain: *physics
    limitations: Caso separado. O run cont+mom entra apenas com os RMSEs de teste após comprovação de igualdade dos pontos, referências e máscara. Configuração de treino e unidade desse run permanecem em revisão.
    pending: Recuperar o Parquet original e confirmar unidades e metadados antes de comparar quantitativamente ou publicar figuras.

